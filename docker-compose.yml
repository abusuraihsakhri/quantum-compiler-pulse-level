version: '3.8'

services:
  quantum-compiler-pulse-level:
    build: .
    container_name: quantum-compiler-pulse-level
    ports:
      - "8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY in your shell or .env}
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
